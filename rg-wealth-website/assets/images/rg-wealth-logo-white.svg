<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="100%" height="100%">
  <!-- Logo Mark (Hexagon + Market Trend Arrow + Twin Internal Arrows) -->
  <g transform="translate(15, 10)">
    <!-- Hexagon Top Roof / Accent Lines -->
    <path d="M 65 15 L 20 40 L 20 85 L 35 77 L 35 48 L 65 31 L 95 48 L 95 62 L 110 54 L 110 40 Z" fill="#38BDF8" />
    
    <!-- Twin Internal Upward Arrows -->
    <path d="M 38 68 L 52 48 L 58 52 L 44 72 Z" fill="#38BDF8" />
    <path d="M 46 44 L 62 48 L 54 62 Z" fill="#38BDF8" />
    <path d="M 54 65 L 68 45 L 74 49 L 60 69 Z" fill="#38BDF8" />
    <path d="M 62 41 L 78 45 L 70 59 Z" fill="#38BDF8" />

    <!-- Hexagon Bottom & Chart Trend Line in Clean White/Silver -->
    <path d="M 20 95 L 65 125 L 110 95 L 110 115 L 65 142 L 20 115 Z" fill="#F8FAFC" />
    <path d="M 110 75 L 110 115 L 98 108 L 98 83 Z" fill="#F8FAFC" />

    <!-- Dynamic Rising Trend Line & Big Arrow -->
    <path d="M 18 90 L 38 72 L 65 105 L 118 42 L 105 32 L 140 22 L 138 58 L 125 48 L 65 122 L 38 90 Z" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <!-- "RG" in Electric Cyan -->
  <text x="175" y="85" font-family="'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#38BDF8" letter-spacing="1">RG</text>
  
  <!-- "WEALTH" in Pure White -->
  <text x="265" y="85" font-family="'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="2">WEALTH</text>

  <!-- Tagline: "FAAYDA AAPKA" in Soft Gold / Silver -->
  <text x="215" y="122" font-family="'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#CBD5E1" letter-spacing="6">FAAYDA AAPKA</text>
</svg>
