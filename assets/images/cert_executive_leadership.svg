<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A46D"/>
      <stop offset="50%" stop-color="#DFCA9B"/>
      <stop offset="100%" stop-color="#A8854D"/>
    </linearGradient>
    <pattern id="guilloche" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0,10 Q 5,0 10,10 T 20,10" fill="none" stroke="rgba(197,164,109,0.06)" stroke-width="0.75"/>
    </pattern>
  </defs>
  <rect width="800" height="560" fill="#FAF9F5"/>
  <rect x="20" y="20" width="760" height="520" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <rect x="28" y="28" width="744" height="504" fill="none" stroke="#101010" stroke-width="1" stroke-dasharray="4,2"/>
  <rect x="34" y="34" width="732" height="492" fill="url(#guilloche)"/>
  
  <!-- Seal / Emblem -->
  <g transform="translate(400, 110)">
    <circle r="42" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle r="36" fill="#101010"/>
    <path d="M-15,-8 L0,-24 L15,-8 L0,8 Z" fill="url(#goldGrad)"/>
    <circle cx="0" cy="14" r="3" fill="url(#goldGrad)"/>
  </g>

  <!-- Content -->
  <text x="400" y="195" font-family="'Cinzel', 'Playfair Display', serif" font-size="14" letter-spacing="4" fill="#737373" text-anchor="middle">CERTIFICATE OF RECOGNITION</text>
  <text x="400" y="235" font-family="'Cinzel', 'Playfair Display', serif" font-size="28" font-weight="700" fill="#101010" text-anchor="middle">EXECUTIVE LEADERSHIP EXCELLENCE</text>
  <line x1="320" y1="250" x2="480" y2="250" stroke="url(#goldGrad)" stroke-width="1.5"/>
  
  <text x="400" y="285" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#737373" text-anchor="middle">This professional credential certifies that</text>
  <text x="400" y="325" font-family="'Playfair Display', serif" font-size="26" font-style="italic" font-weight="600" fill="#C5A46D" text-anchor="middle">Rohit Garg</text>
  <text x="400" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#555555" text-anchor="middle">has demonstrated distinguished mastery in Strategic Organizational Leadership,</text>
  <text x="400" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#555555" text-anchor="middle">Enterprise Governance, and Sustainable Business Growth.</text>
  
  <text x="400" y="420" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="1" fill="#888888" text-anchor="middle">[EDITABLE CREDENTIAL TEMPLATE • VERIFIED PROFESSIONAL RECORD]</text>

  <!-- Signatures -->
  <g transform="translate(180, 475)">
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#101010" stroke-width="0.8"/>
    <text x="0" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#101010" text-anchor="middle">ACCREDITATION BOARD</text>
    <text x="0" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#737373" text-anchor="middle">Executive Leadership Institute</text>
  </g>
  <g transform="translate(620, 475)">
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#101010" stroke-width="0.8"/>
    <text x="0" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#101010" text-anchor="middle">RECORD VERIFIER</text>
    <text x="0" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#737373" text-anchor="middle">Registry No: RG-LEAD-2024</text>
  </g>
</svg>
